<html>
  <head>
    <title>Cultural Map</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="images/Logo_Englisch.png" />

    <style>
      .map {
        display: block;
        height: calc(100vh - 130px);
      }

      .map-button {
        position: absolute;
        border: none;
        background-color: transparent;
        padding: 5px;
        height: 55px;
        width: 55px;
        font-size: var(--standard-font-size);
        font-family: var(--standard-font-family);
        /* Erlaubt dem SVG, sich hinter den Text zu legen */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: background-color 0.3s ease;
      }

      .map-button svg {
        z-index: 2;
        transition: transform 0.3s ease;
      }

      .map-button:hover svg {
        transform: translateY(-20px);
      }

      .map-button::after {
        content: var(--region-name);
        position: absolute;
        background-color: var(--primary-blue);
        color: white;
        white-space: nowrap;
        border-radius: 12px;
        width: 100px;
        padding: 3px;
        opacity: 0;
        transform: translateY(30px);
        /*Vorhang öffnen animation - anfangspose*/
        clip-path: inset(0 50% 0 50%);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease,
          /* Vorhang öffnen animation transition ablauf*/ clip-path 0.4s
            cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }

      .map-button:hover::after {
        opacity: 1;
        transform: translateY(20px); /* Text gleitet sanft von unten rein */
        /*Vorhang öffnen animation - endpose*/
        clip-path: inset(0 0% 0 0%);
      }

      .map-button-active {
        background-color: transparent;
      }

      .map-container {
        position: relative;
        display: inline-block;
        align-self: flex-start;
        transition: all 0.5s ease;
        flex-shrink: 0;
      }

      .white-box {
        width: 30%; /* Gib der Box eine feste Breite */
        min-width: 400px;
        margin: 20px;
        padding: 15px;
        background-color: white;
        border-radius: 12px;
        box-shadow:
          0 4px 8px 0 rgba(0, 0, 0, 0.2),
          0 6px 20px 0 rgba(0, 0, 0, 0.19);
        animation: fadeIn 0.5s ease;

        max-height: calc(100vh - 200px); /* Begrenzt die Höhe der Box */
        display: flex; /* Nutzt Flexbox für die innere Aufteilung */
        flex-direction: column; /* Stapelt Bild, Überschrift und Text */
        overflow: hidden;
      }

      #info-box-content {
        /* --- NEUE EIGENSCHAFTEN --- */
        overflow-y: auto; /* Aktiviert den vertikalen Scrollbalken nur hier */
        flex-grow: 1; /* Lässt den Text den restlichen Platz füllen */
        padding-right: 5px; /* Kleiner Abstand zum Scrollbalken */
      }

      /* 1. Grund-Stil für das SVG-Overlay */
      .region-overlay {
        position: absolute;
        /* WICHTIG: z-index höher als das Bild (0), aber niedriger als Button (5) */
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;

        /* Testweise Rahmen, um zu sehen wo die Box liegt (danach löschen) */
        /* border: 1px solid red; */
      }

      /* 3. Sichtbarkeit steuern */
      .map-button:hover + .region-overlay,
      .map-button.map-button-active + .region-overlay {
        opacity: 1;
      }

      /* 4. Polygon Farben */
      .region-overlay polygon {
        fill: rgba(255, 114, 114, 0.4); /* Dein Rot-Ton */
        stroke: black;
        stroke-width: 2px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .no-display {
        display: none;
      }

      .info-box-image {
        width: calc(100% + 30px);
        margin: -15px -15px -15px -15px;
        border-radius: 12px 12px 0px 0px;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.075);
      }
    </style>
  </head>
  <body
    class="no_margin"
    style="
      background-color: #f4f7f9;
      font-size: var(--standard-text-size);
      font-family: var(--standard-font-family);
    "
  >
    <div id="topBarID"></div>
    <!--TopBar-->
    <div
      style="
        width: 100%;
        display: flex;
        justify-content: center;
        align-content: flex-start;
      "
    >
      <!--Karte-->
      <div id="map-wrapper" class="map-container">
        <img id="uk-image" src="images/UK_Map_1.png" class="map" />
        <!--Hier werden die Northwest Buttons auf der Karte generiert-->
      </div>

      <!--Infobox rechts-->
      <div id="info-box" class="no-display white-box">
        <img id="info-box-img" class="info-box-image" src="" />
        <div
          id="info-box-heading"
          style="
            color: var(--primary-blue);
            font-size: 30px;
            margin-top: 20px;
            margin-bottom: 5px;
            font-family: var(--standard-font-family);
            font-weight: 650;
          "
        >
          <!--Hier wird die Überschrift der Infobox geladen-->
        </div>
        <div id="info-box-content">
          <!--Hier wird der Haupttext reingeladen-->
        </div>
      </div>
    </div>
    <!--BottomBar-->
    <div id="bottomBarID"></div>

    <script>
      // Lädt die funktionalität der Region-Buttons am Anfang
      window.onload = function loadElements() {
        // Lädt die Buttons in den verschiedenen Regionen
        loadButtons();

        // NICHT ANFASSEN!
        // ----------- Code für das Laden der TopBar und BottomBar -----------
        fetch("topBar.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("topBarID").innerHTML = data;
          });

        fetch("bottomBar.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("bottomBarID").innerHTML = data;
          });
        // ------- Code für das Laden der TopBar und BottomBar zu Ende -------
      };

      var response;
      var data;
      async function loadButtons() {
        response = await fetch("data/cultureMapData.json");
        data = await response.json();
        const buttonParent = document.getElementById("map-wrapper");

        data.regions.forEach((region) => {
          const mapButtonHTML = `<button id="${region.id}" class="map-button" style="top:${region.map.topPositionText}; right:${region.map.rightPositionText}; --region-name:'${region.name}';">
          <svg viewBox="0 0 90 90" width="100%" height="100%">
            <path
              d="M 45 90 c -1.415 0 -2.725 -0.748 -3.444 -1.966 l -4.385 -7.417 C 28.167 
              65.396 19.664 51.02 16.759 45.189 c -2.112 -4.331 -3.175 -8.955 -3.175 -13.773 
              C 13.584 14.093 27.677 0 45 0 c 17.323 0 31.416 14.093 31.416 31.416 c 0 4.815 
              -1.063 9.438 -3.157 13.741 c -0.025 0.052 -0.053 0.104 -0.08 0.155 c -2.961 5.909 
              -11.41 20.193 -20.353 35.309 l -4.382 7.413 C 47.725 89.252 46.415 90 45 90 z"
              style="fill: rgb(200, 16, 46)"
            />
            <path
              d="M 45 45.678 c -8.474 0 -15.369 -6.894 -15.369 -15.368 S 36.526 14.941 
              45 14.941 c 8.474 0 15.368 6.895 15.368 15.369 S 53.474 45.678 45 45.678 z"
              style="fill: rgb(255, 255, 255)"
            />
          </svg>
        </button>
        <svg
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
          class="region-overlay"
          style="top:${region.map.svg.topPosition}; right:${region.map.svg.rightPosition}; width:${region.map.svg.width}; height:${region.map.svg.height};"
        >
          <polygon
            points="${region.map.points}"
          />
        </svg>`;
          buttonParent.innerHTML += mapButtonHTML;
        });
        addButtonFunctionality();
      }

      function addButtonFunctionality() {
        const closeButtons = document.querySelectorAll(".map-button");
        const imageUK = document.getElementById("map-wrapper");
        const infoBox = document.getElementById("info-box");
        closeButtons.forEach((button) => {
          button.onclick = () => {
            hasAnyButtonActiveClass = false;
            closeButtons.forEach((button2) => {
              if (button2.classList.contains("map-button-active"))
                hasAnyButtonActiveClass = true;
            });
            if (button.classList.contains("map-button-active")) {
              imageUK.classList.remove("slide");
              button.classList.remove("map-button-active");
              infoBox.classList.add("no-display");
            } else if (hasAnyButtonActiveClass) {
              closeButtons.forEach((button2) => {
                button2.classList.remove("map-button-active");
              });
              button.classList.add("map-button-active");
              UpdateInfoBox(button);
            } else {
              imageUK.classList.add("slide");
              button.classList.add("map-button-active");
              infoBox.classList.remove("no-display");
              UpdateInfoBox(button);
            }
          };
        });
      }

      // Wenn die Textbox Rechts geöffnet oder eine andere Region ausgewählt wird, wird hier der Inhalt geändert
      async function UpdateInfoBox(button) {
        // cultureMapData.json in ein JSON Objekt umwandeln damit der Code damit arbeiten kann

        // Geht alle Regionen durch
        data.regions.forEach((region) => {
          // Bisher funktioniert der Code nur für die Northwest Region
          if (region.id === button.id) {
            const infoBoxHeading = document.getElementById("info-box-heading");
            infoBoxHeading.innerHTML = region.name;
            const infoBoxContent = document.getElementById("info-box-content");
            infoBoxContent.innerHTML = "";
            document.getElementById("info-box-img").src = region.image;

            // Die ganzen Abschnitte vom Haupttext generieren
            region.sections.forEach((section) => {
              const cardHTML = `<h3 style="color: var(--primary-blue)">${section.heading}</h3>
                ${section.content}<br />`;

              infoBoxContent.innerHTML += cardHTML;
            });
          }
          const mapElement = document.getElementById("info-box-content");
          // Scollt beim langen Text rechts wieder nach oben wenn man auf einen Button auf der Karte klickt
          mapElement.scrollTop = 0;
        });
      }
    </script>
  </body>
</html>
